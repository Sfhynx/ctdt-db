<div class="form-container">
    <div class="form-header">
        <h1>{{ isEditMode ? 'Editar' : 'Nueva' }} Team Skill</h1>
        <button class="btn-secondary" (click)="cancel()">Cancelar</button>
    </div>

    <form (ngSubmit)="onSubmit()" #skillForm="ngForm">
        <div class="form-section">
            <h2>Información de la Team Skill</h2>

            <div class="form-group">
                <label for="name">Nombre *</label>
                <input type="text" id="name" [(ngModel)]="teamSkill.name" name="name" required
                    placeholder="Espíritu de Japón">
            </div>

            <div class="form-group">
                <label for="effect">Efecto *</label>
                <textarea id="effect" [(ngModel)]="teamSkill.effect" name="effect" required rows="3"
                    placeholder="+10% a todos los stats de jugadores de Japón"></textarea>
            </div>
        </div>

        <div class="form-actions">
            <button type="button" class="btn-secondary" (click)="cancel()">Cancelar</button>
            <button type="submit" class="btn-primary" [disabled]="!skillForm.form.valid">
                {{ isEditMode ? 'Actualizar' : 'Crear' }} Team Skill
            </button>
        </div>
    </form>
</div>
